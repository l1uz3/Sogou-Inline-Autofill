name: Build APK

# 每种改动只触发一次构建：
#  - 合并/推送到 main：push
#  - PR 分支的推送：pull_request（不再同时触发 push）
#  - 在网页上发布 Release：release（新建标签不再额外触发一次），构建后把 APK 附加到该 Release
#  - 手动：workflow_dispatch
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# 同一个分支 / PR 连续推送时，取消还没跑完的旧构建
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 可选：在仓库 Settings → Secrets 里配置 SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD /
      # SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD 后，release 包使用固定签名
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release signing key"
          else
            echo "No signing secrets, release APK will use the debug key"
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: SogouInlineAutofill
          path: app/build/outputs/apk/**/*.apk

      - name: Rename release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "SogouInlineAutofill-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SogouInlineAutofill-${{ github.ref_name }}.apk
          body_path: RELEASE_NOTES.md
